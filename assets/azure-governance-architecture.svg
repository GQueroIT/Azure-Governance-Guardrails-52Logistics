<path d="M690 427V445" class="softFlow" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arrowRed)"/>

<!-- Monitoring children -->
<rect x="845" y="345" width="210" height="82" rx="16" fill="#500724" stroke="#D946EF"/>
<text x="950" y="375" text-anchor="middle" class="miniT">Azure Activity Log</text>
<text x="950" y="400" text-anchor="middle" class="mini">Who changed what and when</text>

<rect x="845" y="445" width="210" height="80" rx="16" fill="#4A044E" stroke="#E879F9" class="pulseFast"/>
