<rect x="870" y="665" width="205" height="76" rx="14" fill="#431407" stroke="#F97316"/>
<text x="973" y="695" text-anchor="middle" class="miniT">4. Drift Detected</text>
<text x="973" y="720" text-anchor="middle" class="mini">Terraform sees missing control</text>

<rect x="1130" y="665" width="205" height="76" rx="14" fill="#052E16" stroke="#15803D"/>
