<!-- Exception note -->
<rect x="60" y="815" width="1480" height="50" rx="12" fill="#111827" stroke="#7F1D1D"/>
<text x="85" y="846" class="tx" font-weight="600">DOCUMENTED EXCEPTION: monitoring_rg is excluded from Allowed Locations because some Azure monitoring resources may require global scope.</text>
</svg>