<text x="950" y="500" text-anchor="middle" class="mini">Lock / Policy delete → Email</text>

<path d="M950 300V345" class="softFlow" stroke="#D946EF" stroke-width="2.5" marker-end="url(#arrowMagenta)"/>
<path d="M950 427V445" class="softFlow" stroke="#E879F9" stroke-width="2.5" marker-end="url(#arrowMagenta)"/>

<!-- Recovery children -->
<rect x="1105" y="345" width="210" height="82" rx="16" fill="#431407" stroke="#F97316"/>
<text x="1210" y="375" text-anchor="middle" class="miniT">DRIFT DETECTED</text>
<text x="1210" y="400" text-anchor="middle" class="mini">Desired state ≠ live Azure</text>

<rect x="1105" y="445" width="210" height="80" rx="16" fill="#052E16" stroke="#15803D"/>
<text x="1210" y="475" text-anchor="middle" class="miniT">PowerShell Audit</text>
<text x="1210" y="500" text-anchor="middle" class="mini">Policies • RBAC • Lock</text>

<path d="M1210 300V345" class="softFlow" stroke="#F97316" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
<path d="M1210 427V445" class="softFlow" stroke="#15803D" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

<!-- Health children -->
<rect x="1370" y="345" width="160" height="180" rx="16" fill="#052E16" stroke="#22C55E"/>
<text x="1390" y="382" class="healthSm">✓ Policies 3/3</text>
<text x="1390" y="417" class="healthSm">✓ Lock PASS</text>
<text x="1390" y="452" class="healthSm">✓ RBAC Validated</text>
<text x="1390" y="487" class="healthSm">✓ Monitoring Active</text>
<path d="M1450 300V345" class="softFlow" stroke="#4ADE80" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

<!-- Cross-links between lower bubbles to make system feel connected -->
<path d="M535 386H585" class="softFlow" stroke="#BE123C" stroke-width="2" marker-end="url(#arrowBurgundy)"/>
<path d="M795 386H845" class="softFlow" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)"/>
<path d="M1055 386H1105" class="softFlow" stroke="#D946EF" stroke-width="2" marker-end="url(#arrowMagenta)"/>
<path d="M1315 386H1370" class="softFlow" stroke="#F97316" stroke-width="2" marker-end="url(#arrowOrange)"/>

<!-- Bottom scenario flow -->
<rect x="60" y="595" width="1480" height="190" rx="20" fill="#0F172A" stroke="#334155"/>
<text x="85" y="628" class="stage">LIVE GOVERNANCE EVENT FLOW — WHAT HAPPENS WHEN A CONTROL IS CHANGED OUTSIDE TERRAFORM?</text>

<rect x="90" y="665" width="205" height="76" rx="14" fill="#4C0519" stroke="#BE123C"/>
<text x="193" y="695" text-anchor="middle" class="miniT">1. Policy Deleted</text>
