<text x="1233" y="720" text-anchor="middle" class="mini">terraform apply remediates</text>

<rect x="1390" y="665" width="120" height="76" rx="14" fill="#14532D" stroke="#4ADE80" class="pulseFast"/>
<text x="1450" y="695" text-anchor="middle" class="miniT">6. Healthy</text>
<text x="1450" y="720" text-anchor="middle" class="mini">Verified</text>

<path d="M295 703H350" class="flow" stroke="#BE123C" stroke-width="3" marker-end="url(#arrowBurgundy)"/>
