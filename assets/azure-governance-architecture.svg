<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0B1020"/>
    <stop offset="100%" stop-color="#111827"/>
  </linearGradient>

  <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#8B5CF6"/></marker>
  <marker id="arrowBurgundy" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#BE123C"/></marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#38BDF8"/></marker>
  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#EF4444"/></marker>
  <marker id="arrowMagenta" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#D946EF"/></marker>
  <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#F97316"/></marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#4ADE80"/></marker>
  <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#94A3B8"/></marker>

  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <style><![CDATA[
    text{font-family:"Segoe UI",Arial,sans-serif}
    .title{fill:#F8FAFC;font-size:30px;font-weight:700}
    .sub{fill:#94A3B8;font-size:15px}
    .stage{fill:#CBD5E1;font-size:12px;font-weight:700;letter-spacing:1px}
    .nt{fill:#F8FAFC;font-size:15px;font-weight:700}
    .tx{fill:#CBD5E1;font-size:11px;font-weight:500}
    .miniT{fill:#F8FAFC;font-size:12px;font-weight:700}
    .mini{fill:#CBD5E1;font-size:10px}
    .health{fill:#DCFCE7;font-size:17px;font-weight:800}
    .healthSm{fill:#DCFCE7;font-size:11px;font-weight:600}
    .flow{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 10;animation:dash 1.1s linear infinite}
    .softFlow{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 9;animation:dash 1.6s linear infinite;opacity:.85}
    .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .pulseFast{animation:pulse 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes dash{to{stroke-dashoffset:-40}}
    @keyframes pulse{0%,100%{opacity:1;filter:none}50%{opacity:.78;filter:url(#glow)}}
  ]]></style>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>

<!-- Header -->
<text x="800" y="42" text-anchor="middle" class="title">52 LOGISTICS — AZURE GOVERNANCE GUARDRAILS</text>
<text x="800" y="68" text-anchor="middle" class="sub">One connected control path from deployment to verification</text>

<rect x="70" y="92" width="1460" height="44" rx="14" fill="#0F172A" stroke="#334155"/>
<text x="800" y="120" text-anchor="middle" class="stage">DEPLOY → GOVERN → PROTECT → OBSERVE → DETECT → REMEDIATE → VERIFY</text>

<!-- MAIN BACKBONE -->
<text x="175" y="168" text-anchor="middle" class="stage">1. BUILD</text>
<text x="430" y="168" text-anchor="middle" class="stage">2. GOVERN</text>
<text x="690" y="168" text-anchor="middle" class="stage">3. AZURE</text>
<text x="950" y="168" text-anchor="middle" class="stage">4. MONITOR</text>
<text x="1210" y="168" text-anchor="middle" class="stage">5. RECOVER</text>
<text x="1450" y="168" text-anchor="middle" class="stage">6. VERIFY</text>

<rect x="70" y="190" width="210" height="110" rx="18" fill="#3B0764" stroke="#8B5CF6" stroke-width="3" class="pulse"/>
<text x="175" y="230" text-anchor="middle" class="nt">Terraform</text>
<text x="175" y="257" text-anchor="middle" class="tx">Desired governance state</text>
<text x="175" y="279" text-anchor="middle" class="tx">defined as code</text>

<rect x="325" y="190" width="210" height="110" rx="18" fill="#4C0519" stroke="#BE123C" stroke-width="3" class="pulse"/>
<text x="430" y="230" text-anchor="middle" class="nt">Governance</text>
<text x="430" y="257" text-anchor="middle" class="tx">Policy + RBAC + Budget</text>
<text x="430" y="279" text-anchor="middle" class="tx">establish guardrails</text>

<rect x="585" y="190" width="210" height="110" rx="18" fill="#0C4A6E" stroke="#38BDF8" stroke-width="3" class="pulse"/>
<text x="690" y="230" text-anchor="middle" class="nt">Azure</text>
<text x="690" y="257" text-anchor="middle" class="tx">Subscription + RG</text>
<text x="690" y="279" text-anchor="middle" class="tx">protected workload scope</text>

<rect x="845" y="190" width="210" height="110" rx="18" fill="#500724" stroke="#D946EF" stroke-width="3" class="pulse"/>
<text x="950" y="230" text-anchor="middle" class="nt">Monitoring</text>
<text x="950" y="257" text-anchor="middle" class="tx">Activity Log + Alerts</text>
<text x="950" y="279" text-anchor="middle" class="tx">change accountability</text>

<rect x="1105" y="190" width="210" height="110" rx="18" fill="#431407" stroke="#F97316" stroke-width="3" class="pulse"/>
<text x="1210" y="230" text-anchor="middle" class="nt">Drift &amp; Recovery</text>
<text x="1210" y="257" text-anchor="middle" class="tx">plan detects</text>
<text x="1210" y="279" text-anchor="middle" class="tx">apply restores</text>

<rect x="1370" y="190" width="160" height="110" rx="18" fill="#14532D" stroke="#4ADE80" stroke-width="3" class="pulseFast"/>
<text x="1450" y="228" text-anchor="middle" class="health">✓ HEALTHY</text>
<text x="1450" y="258" text-anchor="middle" class="healthSm">Policies 3/3 PASS</text>
<text x="1450" y="280" text-anchor="middle" class="healthSm">Lock PASS</text>

<!-- Backbone arrows -->
<path d="M280 245H325" class="flow" stroke="#8B5CF6" stroke-width="4" marker-end="url(#arrowPurple)"/>
<path d="M535 245H585" class="flow" stroke="#BE123C" stroke-width="4" marker-end="url(#arrowBurgundy)"/>
<path d="M795 245H845" class="flow" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrowBlue)"/>
<path d="M1055 245H1105" class="flow" stroke="#D946EF" stroke-width="4" marker-end="url(#arrowMagenta)"/>
<path d="M1315 245H1370" class="flow" stroke="#F97316" stroke-width="4" marker-end="url(#arrowOrange)"/>

<!-- DETAIL BUBBLES -->
<!-- Terraform children -->
<rect x="70" y="355" width="210" height="170" rx="16" fill="#1E1B4B" stroke="#6D28D9"/>
<text x="175" y="386" text-anchor="middle" class="miniT">Terraform Configuration</text>
<text x="92" y="418" class="mini">provider.tf</text>
<text x="92" y="441" class="mini">variables.tf</text>
<text x="92" y="464" class="mini">policies.tf • rbac.tf</text>
<text x="92" y="487" class="mini">locks.tf • monitoring.tf</text>
<text x="92" y="510" class="mini">budgets.tf • defender.tf</text>
<path d="M175 300V355" class="softFlow" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrowPurple)"/>

<!-- Governance children -->
<rect x="325" y="345" width="210" height="82" rx="16" fill="#3F0A18" stroke="#9F1239"/>
<text x="430" y="375" text-anchor="middle" class="miniT">Azure Policy</text>
<text x="430" y="400" text-anchor="middle" class="mini">Tag • Regions • VM SKUs</text>

<rect x="325" y="445" width="210" height="80" rx="16" fill="#082F49" stroke="#0284C7"/>
<text x="430" y="475" text-anchor="middle" class="miniT">RBAC</text>
<text x="430" y="500" text-anchor="middle" class="mini">Owner • Reader • Contributor</text>

<path d="M430 300V330H430V345" class="softFlow" stroke="#BE123C" stroke-width="2.5" marker-end="url(#arrowBurgundy)"/>
<path d="M430 427V445" class="softFlow" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

<!-- Azure children -->
<rect x="585" y="345" width="210" height="82" rx="16" fill="#082F49" stroke="#38BDF8"/>
<text x="690" y="375" text-anchor="middle" class="miniT">52 Logistics Subscription</text>
<text x="690" y="400" text-anchor="middle" class="mini">52logistics-rg</text>

<rect x="585" y="445" width="210" height="80" rx="16" fill="#450A0A" stroke="#EF4444" class="pulseFast"/>
<text x="690" y="475" text-anchor="middle" class="miniT">Management Lock</text>
<text x="690" y="500" text-anchor="middle" class="mini">rg_delete_lock • CanNotDelete</text>

